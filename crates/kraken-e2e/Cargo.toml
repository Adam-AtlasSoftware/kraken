[package]
name = "kraken-e2e"
description = "End-to-end safety and exit-criterion tests for KRAKEN (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
async-trait = "0.1.89"
engine-fake = { path = "../engine-fake", version = "0.2.0" }
engine-native = { path = "../engine-native", version = "0.2.0" }
kraken-engine = { path = "../kraken-engine", version = "0.2.0" }
kraken-mcp = { path = "../kraken-mcp", version = "0.2.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.2.0" }
rmcp = { version = "=3.5.1", features = ["server", "client", "transport-io", "transport-child-process", "elicitation"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "process"] }
