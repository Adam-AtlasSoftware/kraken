[package]
name = "kraken-assist"
description = "KRAKEN assistant core: registry tool host, beginner tasks (explain, overview, auto-name) and the RE glossary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
kraken-agent = { path = "../kraken-agent", version = "0.0.0" }
kraken-host = { path = "../kraken-host", version = "0.0.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.16", default-features = false }
toml = "0.8"

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.0.0" }
kraken-engine = { path = "../kraken-engine", version = "0.0.0" }
schemars.workspace = true
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
