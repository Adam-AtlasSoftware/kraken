[package]
name = "kraken-record"
description = "Records engine-fake fixtures from the corpus with a real Ghidra, and checks them for drift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
engine-fake = { path = "../engine-fake", version = "0.3.0" }
engine-ghidra = { path = "../engine-ghidra", version = "0.3.0" }
kraken-engine = { path = "../kraken-engine", version = "0.3.0" }
kraken-proto.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
kraken-engine = { path = "../kraken-engine", version = "0.3.0", features = ["testing"] }
serde.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "macros"] }
