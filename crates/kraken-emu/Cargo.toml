[package]
name = "kraken-emu"
description = "KRAKEN emulation layer: x86, x86-64, ARM/Thumb, AArch64 and RISC-V 32/64 on icicle's SLEIGH CPU, with C calling conventions, a Linux user-mode syscall layer and a stepping API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# icicle-emu is not on crates.io; the same pinned commit as kraken-rewrite (deny.toml [sources],
# spikes/rewrite-loop/NOTES.md). MIT OR Apache-2.0.
icicle-cpu = { version = "0.1.0", git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
icicle-vm = { version = "0.2.0", git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
pcode = { version = "0.2.0", git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
sleigh-runtime = { version = "0.1.0", git = "https://github.com/icicle-emu/icicle-emu", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
kraken-sidecar = { path = "../kraken-sidecar", version = "0.2.0" }
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "pe", "std"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "kraken-emu-run"
path = "src/bin/kraken-emu-run.rs"
