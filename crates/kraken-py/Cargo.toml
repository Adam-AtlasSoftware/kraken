[package]
name = "kraken-py"
description = "Python bindings for KRAKEN (PyO3): scripting over the krakend daemon, with an in-process fallback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# The PyO3 module itself. Off by default so `cargo build/test/clippy --workspace` never needs a
# Python interpreter or libpython; maturin turns it on (see pyproject.toml).
python = ["dep:pyo3"]
# Hidden test hook `kraken._testing.fake_project` over the fixture-driven FakeEngine (implies the
# PyO3 module: maturin replaces the pyproject feature list when --features is given).
testing = ["python", "dep:engine-fake", "dep:tempfile"]

[dependencies]
async-trait = "0.1.89"
engine-fake = { path = "../engine-fake", version = "0.1.0", optional = true }
kraken-engine = { path = "../kraken-engine", version = "0.1.0" }
kraken-host = { path = "../kraken-host", version = "0.1.0" }
kraken-ipc = { path = "../kraken-ipc", version = "0.1.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.1.0" }
pyo3 = { version = "0.30", optional = true, features = ["abi3-py310"] }
regex = { version = "1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3", optional = true }
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "macros"] }
