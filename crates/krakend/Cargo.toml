[package]
name = "krakend"
description = "The KRAKEN daemon: owns project sessions and Ghidra sidecars, serves the command registry over local IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "krakend"

[[bin]]
name = "krakend"
path = "src/main.rs"

[features]
# A scripted engine for tests, selected with the hidden `--fake-engine <fixture>` flag.
default = ["fake-engine"]
fake-engine = ["dep:engine-fake"]

[dependencies]
async-trait = "0.1.89"
engine-fake = { path = "../engine-fake", version = "0.0.0", optional = true }
kraken-engine = { path = "../kraken-engine", version = "0.0.0" }
kraken-host = { path = "../kraken-host", version = "0.0.0" }
kraken-ipc = { path = "../kraken-ipc", version = "0.0.0" }
kraken-model = { path = "../kraken-model", version = "0.0.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.0.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.0.0" }
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
