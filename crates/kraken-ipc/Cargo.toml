[package]
name = "kraken-ipc"
description = "KRAKEN daemon IPC: runtime paths, auth token, framing, server/client, single-instance lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kraken-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = "0.1"
getrandom = "0.3"
subtle = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
