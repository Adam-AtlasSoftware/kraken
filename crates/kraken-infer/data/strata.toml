# Strata (https://github.com/Niko1221/Strata, MIT) serves large MoE models on small VRAM by
# keeping the experts in system RAM. Everything KRAKEN fetches for it is pinned here and setup
# refuses any download whose SHA-256 differs. Strata publishes no hashes for its source, so the
# two source archive hashes were computed from the pinned revisions when this file was written;
# model hashes are Hugging Face's published LFS oids at the pinned repository revisions.
# Minimums are Strata's own (README, setup.py): 12 GiB video memory, 32 GiB RAM, about 80 GiB
# disk; per-model RAM needs are the table in setup.py. Linux has no prebuilt engine at this
# release, so the engine is compiled from the pinned source (needs nvcc and a C++ compiler).

[engine]
version = "0.2.1"
commit = "90767252f420e25223c739d604145ad15911d48b"
url = "https://codeload.github.com/Niko1221/Strata/tar.gz/90767252f420e25223c739d604145ad15911d48b"
sha256 = "8bf2a576534841b4951842f26dae04c257a43b7346a3fb8eb90ecf5a03e08a61"
size = 27918695
license = "MIT"
requirements_sha256 = "d30c7dd2c862894b549f903007dafeb0fffa8f2134715c1e31f34dda5f3fa314"
min_vram_gib = 12
min_ram_gib = 32
min_disk_gib = 80
build_disk_gib = 8
python_min = "3.10"

[llama_cpp]
commit = "3cf03257f219afbe7334045ff7c6a06ac68c627d"
url = "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/3cf03257f219afbe7334045ff7c6a06ac68c627d"
sha256 = "c076d7534afa0e5d0ec2a0d425b11e791c16f3de0d727221aea071cef156a280"
size = 37513049
license = "MIT"

