[package]
name = "kraken-gui"
description = "KRAKEN desktop GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kraken-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# default_fonts is deliberately off: the app bundles IBM Plex (decision 93).
eframe = { version = "=0.36.2", default-features = false, features = [
    "glow",
    "wgpu",
    "x11",
    "wayland",
] }
egui = { version = "=0.36.2", default-features = false }
egui_dock = "=0.21.1"
image = { version = "0.25", default-features = false, features = ["png"] }
kraken-acp = { path = "../kraken-acp", version = "0.1.0" }
kraken-agent = { path = "../kraken-agent", version = "0.1.0" }
kraken-assist = { path = "../kraken-assist", version = "0.1.0" }
kraken-gui-widgets = { path = "../kraken-gui-widgets", version = "0.1.0" }
kraken-ipc = { path = "../kraken-ipc", version = "0.1.0" }
kraken-host = { path = "../kraken-host", version = "0.1.0" }
kraken-model = { path = "../kraken-model", version = "0.1.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.1.0" }
kraken-rewrite = { path = "../kraken-rewrite", version = "0.1.0" }
kraken-viewmodel = { path = "../kraken-viewmodel", version = "0.1.0" }
krakend = { path = "../krakend", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["wgpu"] }
engine-fake = { path = "../engine-fake", version = "0.1.0" }
kraken-model = { path = "../kraken-model", version = "0.1.0" }
tempfile = "3"
