[package]
name = "kraken-viewmodel"
description = "KRAKEN GUI view-model: all GUI state and logic behind a Backend trait, no egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["inprocess", "demo", "daemon"]
# Backend running the command registry inside the GUI process.
inprocess = ["dep:kraken-registry"]
# Demo project over the fake engine (implies inprocess).
demo = ["inprocess", "dep:engine-fake", "dep:kraken-engine", "dep:tempfile"]
# Backend talking to `krakend` over local IPC (decisions 13, 17, 34).
daemon = ["dep:kraken-host", "dep:kraken-ipc", "dep:kraken-model"]

[dependencies]
async-trait = "0.1.89"
engine-fake = { path = "../engine-fake", version = "0.0.0", optional = true }
kraken-engine = { path = "../kraken-engine", version = "0.0.0", optional = true }
kraken-host = { path = "../kraken-host", version = "0.0.0", optional = true }
kraken-ipc = { path = "../kraken-ipc", version = "0.0.0", optional = true }
kraken-model = { path = "../kraken-model", version = "0.0.0", optional = true }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.0.0", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3", optional = true }
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.0.0" }
krakend = { path = "../krakend", version = "0.0.0" }
kraken-host = { path = "../kraken-host", version = "0.0.0" }
kraken-ipc = { path = "../kraken-ipc", version = "0.0.0" }
kraken-model = { path = "../kraken-model", version = "0.0.0" }
kraken-registry = { path = "../kraken-registry", version = "0.0.0" }
tempfile = "3"
