[package]
name = "kraken-gui-widgets"
description = "KRAKEN reusable egui widgets: theme, virtual list, hex view, decompiler text, listing, CFG graph view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
egui = { version = "=0.36.2", default-features = false }
kraken-proto.workspace = true
kraken-layout = { path = "../kraken-layout", version = "0.3.0" }

[dev-dependencies]
anyhow = "1"
eframe = { version = "=0.36.2", default-features = false, features = [
    "glow",
    "wgpu",
    "x11",
    "wayland",
    "default_fonts",
] }
egui_dock = "=0.21.1"
egui_kittest = "=0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
