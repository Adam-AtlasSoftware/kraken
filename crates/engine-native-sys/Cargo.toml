[package]
name = "engine-native-sys"
description = "Builds Ghidra's C++ decompiler and Sleigh (Apache-2.0) as a static library and binds a KRAKEN shim over them with cxx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
links = "kraken_decomp"
build = "build.rs"

[features]
# Fail the build when the Ghidra decompiler sources are missing instead of building the stub
# (which reports the library as unavailable at run time).
require-native = []

[dependencies]
thiserror.workspace = true

# Linux and Windows (MSVC) build the native library; elsewhere the stub needs no C++ toolchain
[target.'cfg(any(target_os = "linux", all(windows, target_env = "msvc")))'.dependencies]
cxx = "1.0.150"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
cxx-build = "1.0.150"
