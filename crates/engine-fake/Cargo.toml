[package]
name = "engine-fake"
description = "In-memory fake KRAKEN engine driven by JSON fixtures, for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
kraken-engine = { path = "../kraken-engine", version = "0.0.0", features = ["testing"] }
kraken-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.16", default-features = false }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
