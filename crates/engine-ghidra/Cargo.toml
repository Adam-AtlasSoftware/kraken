[package]
name = "engine-ghidra"
description = "KRAKEN engine backed by a confined Ghidra JVM sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
kraken-engine = { path = "../kraken-engine", version = "0.2.0" }
kraken-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros", "io-util", "net", "fs"] }
tokio-util = { version = "0.7.16", default-features = false }
tracing = "0.1"
kraken-procguard = { path = "../kraken-procguard", version = "0.2.0" }
kraken-sidecar = { path = "../kraken-sidecar", version = "0.2.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
kraken-sidecar = { path = "../kraken-sidecar", version = "0.2.0", features = ["testing"] }
kraken-engine = { path = "../kraken-engine", version = "0.2.0", features = ["testing"] }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
