[package]
name = "engine-native"
description = "KRAKEN native (JVM-free) engine: ELF loading, Sleigh disassembly and the Ghidra C++ decompiler in a confined worker process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kraken-native-worker"
path = "src/bin/kraken-native-worker.rs"

[dependencies]
async-trait = "0.1.89"
cpp_demangle = "0.5.1"
rustc-demangle = "0.1"
engine-native-sys = { path = "../engine-native-sys", version = "0.3.0" }
kraken-confine = { path = "../kraken-confine", version = "0.3.0" }
kraken-engine = { path = "../kraken-engine", version = "0.3.0" }
kraken-proto.workspace = true
kraken-sidecar = { path = "../kraken-sidecar", version = "0.3.0" }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "op_code_info", "instr_info"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "pe", "coff", "archive", "compression", "std"] }
msvc-demangler = "0.11"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "io-std"] }
tokio-util = { version = "0.7.16", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
kraken-engine = { path = "../kraken-engine", version = "0.3.0", features = ["testing"] }
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
