# ---- Sysroots: the loader and shared libraries a dynamically linked program needs, so the
# built-in emulator can run it. Pinned Debian 13 (trixie) packages from deb.debian.org, checked
# by SHA-256 (the Packages index of 2026-10-30). Unpacked in Rust into <data dir>/integrations/
# sysroot-<arch>/<version>/ in the layout `cargo xtask emu-sysroots` makes. Debian publishes no
# riscv32 port, so there is no riscv32 sysroot: RV32 programs run statically linked only.

[[emulator]]
id = "sysroot-aarch64"
name = "AArch64 libraries"
kind = "sysroot"
summary = "Loader and C/C++ runtime libraries to emulate dynamically linked AArch64 programs"
homepage = "https://packages.debian.org/trixie/libc6"
platforms = ["Linux AArch64"]
license = "LGPL-2.1-or-later"
notice = "Debian's libc6, libgcc-s1 and libstdc++6 packages (GNU C Library and GCC runtime, LGPL-2.1-or-later with the GCC runtime exception), downloaded from deb.debian.org and unpacked here; nothing of them is shipped with KRAKEN. The emulator reads them as the guest's /lib."
[emulator.sysroot]
set = "aarch64"
loader = "usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1"
[[emulator.artifact]]
version = "debian13-2.41-12-deb13u4"
url = "https://deb.debian.org/debian/pool/main/g/glibc/libc6_2.41-12+deb13u4_arm64.deb"
sha256 = "8784eda966b189c777a384dac5ce009e8fc9b52d006926c5a013e7fa8aa688cc"
size = 2483572
format = "deb"
[[emulator.artifact]]
version = "debian13-2.41-12-deb13u4"
url = "https://deb.debian.org/debian/pool/main/g/gcc-14/libgcc-s1_14.2.0-19_arm64.deb"
sha256 = "1108bc87879833d6d9a145f22a4a15cddb34e065b4b5f4b97bee586adbac2851"
