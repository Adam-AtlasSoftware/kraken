# The compiled-in integrations catalogue (Linux x86_64 builds).
#
# Nothing here is bundled with KRAKEN. An [[artifact]] is the upstream project's own release asset,
# pinned by version and SHA-256 (GitHub's release API publishes the digest; checked 2026-10-28);
# KRAKEN downloads it on the user's machine and never redistributes it. An entry without an
# [[artifact]] for this platform is "use the copy you already have".
#
# argv templates: {exe} the emulator, {binary} the file to run, {dir} a private run directory,
# {port} the GDB stub port.

schema = 1

[[emulator]]
id = "xemu"
name = "xemu"
summary = "Original Xbox emulator"
homepage = "https://xemu.app"
platforms = ["Original Xbox"]
formats = ["iso", "xiso"]
license = "GPL-2.0-or-later"
notice = "xemu needs the MCPX boot ROM, a flash image and a hard disk image that you dump from your own console; KRAKEN does not fetch or ship them."
[emulator.detect]
names = ["xemu"]
flatpak = "app.xemu.xemu"
paths = ["~/Applications/xemu*.AppImage", "~/.local/bin/xemu*.AppImage"]
[emulator.run]
argv = ["{exe}", "-dvd_path", "{binary}"]
[[emulator.artifact]]
version = "0.8.139"
url = "https://github.com/xemu-project/xemu/releases/download/v0.8.139/xemu-0.8.139-x86_64.AppImage"
sha256 = "220282aacf09b30b35c55ba900a774fb6940c70deca1408bc70a4c9cc67c322f"
size = 17971704
format = "file"
entry = "xemu-0.8.139-x86_64.AppImage"

[[emulator]]
id = "xenia-canary"
name = "Xenia Canary"
summary = "Xbox 360 emulator (community Canary branch)"
homepage = "https://github.com/xenia-canary/xenia-canary-releases"
platforms = ["Xbox 360"]
formats = ["xex", "iso", "xcp"]
license = "BSD-3-Clause"
contains_key_material = true
notice = "The Xenia binary embeds Xbox 360 decryption key material that Microsoft owns. KRAKEN fetches it only from upstream's release page, only after you ask, and never ships or mirrors it; an agent cannot install it for you. Run only games you own."
[emulator.detect]
names = ["xenia_canary", "xenia-canary"]
paths = ["~/Applications/xenia_canary", "~/.local/bin/xenia_canary"]
[emulator.run]
argv = ["{exe}", "{binary}"]
[[emulator.artifact]]
version = "02d2cb5"
url = "https://github.com/xenia-canary/xenia-canary-releases/releases/download/02d2cb5/xenia_canary_linux.tar_.xz"
sha256 = "5ac3bcd35430dc406cc79cb403dc326341514a5e3c19e118a37386dc46f4e6c1"
size = 3462192
format = "tar_xz"
entry = "build/bin/Linux/Release/xenia_canary"

