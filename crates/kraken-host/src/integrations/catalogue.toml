# The compiled-in integrations catalogue (Linux x86_64 builds).
#
# Nothing here is bundled with KRAKEN. An [[artifact]] is the upstream project's own release asset,
# pinned by version and SHA-256 (GitHub's release API publishes the digest; checked 2026-10-28);
# KRAKEN downloads it on the user's machine and never redistributes it. An entry without an
# [[artifact]] for this platform is "use the copy you already have".
#
# argv templates: {exe} the emulator, {binary} the file to run, {dir} a private run directory,
# {port} the GDB stub port.

schema = 1

[[emulator]]
id = "xemu"
name = "xemu"
summary = "Original Xbox emulator"
homepage = "https://xemu.app"
platforms = ["Original Xbox"]
formats = ["iso", "xiso"]
license = "GPL-2.0-or-later"
notice = "xemu needs the MCPX boot ROM, a flash image and a hard disk image that you dump from your own console; KRAKEN does not fetch or ship them."
[emulator.detect]
names = ["xemu"]
flatpak = "app.xemu.xemu"
paths = ["~/Applications/xemu*.AppImage", "~/.local/bin/xemu*.AppImage"]
[emulator.run]
argv = ["{exe}", "-dvd_path", "{binary}"]
[[emulator.artifact]]
version = "0.8.139"
url = "https://github.com/xemu-project/xemu/releases/download/v0.8.139/xemu-0.8.139-x86_64.AppImage"
sha256 = "220282aacf09b30b35c55ba900a774fb6940c70deca1408bc70a4c9cc67c322f"
size = 17971704
format = "file"
entry = "xemu-0.8.139-x86_64.AppImage"

