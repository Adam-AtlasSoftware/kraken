[[emulator]]
id = "qemu-user-x86-64"
name = "QEMU user mode (x86-64)"
summary = "Runs a Linux x86-64 program on this computer, with a GDB stub"
homepage = "https://www.qemu.org"
kind = "tool"
platforms = ["Linux x86-64 programs"]
formats = ["elf"]
license = "GPL-2.0-only"
notice = "Install QEMU from your distribution (package `qemu-user`); KRAKEN detects it. User mode runs the program with this computer's system calls, so a hostile program can act on your files: KRAKEN asks before every run."
[emulator.detect]
names = ["qemu-x86_64"]
probe = true
[emulator.run]
argv = ["{exe}", "{binary}"]
gdb_argv = ["{exe}", "-g", "{dir}/gdb.sock", "{binary}"]
gui = false

