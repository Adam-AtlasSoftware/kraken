# ---- The Rust toolchain rewrites compile with. Detected on PATH first (`cargo`); otherwise
# KRAKEN downloads rustup-init (pinned, SHA-256 checked) and runs it with RUSTUP_HOME and
# CARGO_HOME inside its own install directory, so ~/.cargo and ~/.rustup are never touched.
[[emulator]]
id = "rust-toolchain"
name = "Rust toolchain"
kind = "toolchain"
summary = "rustc and cargo to build the Rust rewrites, with the x86-64 musl target"
homepage = "https://rustup.rs"
platforms = ["Linux x86-64"]
license = "MIT OR Apache-2.0"
notice = "KRAKEN downloads rustup-init from static.rust-lang.org and lets it install the pinned toolchain from the same host, into KRAKEN's data directory only (about 250 MB to download, 800 MB on disk). It changes nothing in your home directory or shell profile."
[emulator.detect]
names = ["cargo"]
probe = true
[emulator.toolchain]
channel = "1.99.1"
targets = ["x86_64-unknown-linux-musl"]
[[emulator.artifact]]
version = "rustup-1.29.2"
url = "https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init"
sha256 = "5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4"
size = 21139856
format = "file"
entry = "rustup-init"
