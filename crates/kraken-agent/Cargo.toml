[package]
name = "kraken-agent"
description = "KRAKEN built-in agent loop: chat providers, tool host abstraction and prompt-injection-safe tool plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
kraken-proto.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.16", default-features = false }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
