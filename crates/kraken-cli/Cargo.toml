[package]
name = "kraken-cli"
description = "The `kraken` command line: one subcommand per registry command, plus `kraken mcp`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "kraken_cli"

[[bin]]
name = "kraken"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1.89"
kraken-acp = { path = "../kraken-acp", version = "0.1.0" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "string", "color"] }
kraken-agent = { path = "../kraken-agent", version = "0.1.0" }
kraken-assist = { path = "../kraken-assist", version = "0.1.0" }
kraken-engine = { path = "../kraken-engine", version = "0.1.0" }
kraken-eval = { path = "../kraken-eval", version = "0.1.0" }
kraken-host = { path = "../kraken-host", version = "0.1.0" }
kraken-model = { path = "../kraken-model", version = "0.1.0" }
kraken-ipc = { version = "0.1.0", path = "../kraken-ipc" }
kraken-mcp = { path = "../kraken-mcp", version = "0.1.0" }
kraken-proto.workspace = true
kraken-registry = { path = "../kraken-registry", version = "0.1.0" }
kraken-rewrite = { path = "../kraken-rewrite", version = "0.1.0" }
krakend = { path = "../krakend", version = "0.1.0", default-features = false }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.1.0" }
kraken-infer = { path = "../kraken-infer", version = "0.1.0" }
krakend = { path = "../krakend", version = "0.1.0" }
rmcp = { version = "=3.5.1", features = ["server", "client", "transport-io", "transport-child-process", "elicitation"] }
schemars.workspace = true
serde.workspace = true
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
