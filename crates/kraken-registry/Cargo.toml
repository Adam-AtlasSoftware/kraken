[package]
name = "kraken-registry"
description = "KRAKEN command registry: typed commands, sessions, the mutation pipeline and jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
kraken-engine = { path = "../kraken-engine", version = "0.0.0" }
kraken-model = { path = "../kraken-model", version = "0.0.0" }
kraken-proto.workspace = true
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "coff", "macho", "std"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.0.0" }
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
