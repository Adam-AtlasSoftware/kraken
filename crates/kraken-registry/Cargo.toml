[package]
name = "kraken-registry"
description = "KRAKEN command registry: typed commands, sessions, the mutation pipeline and jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"
kraken-infer = { path = "../kraken-infer", version = "0.2.0" }
kraken-emu = { path = "../kraken-emu", version = "0.2.0" }
kraken-engine = { path = "../kraken-engine", version = "0.2.0" }
kraken-model = { path = "../kraken-model", version = "0.2.0" }
kraken-proto.workspace = true
kraken-sidecar = { path = "../kraken-sidecar", version = "0.2.0" }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "pe", "coff", "macho", "archive", "compression", "std"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
engine-fake = { path = "../engine-fake", version = "0.2.0" }
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
