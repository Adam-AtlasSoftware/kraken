# cargo-deny configuration. Run: cargo deny check
[graph]
all-features = true

[advisories]
ignore = [
    # paste is a compile-time proc-macro pulled in by egui_dock; unmaintained, no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "build-time only via egui_dock; revisit when egui_dock drops it" },
    # ruzstd is reached only through icicle-cpu -> addr2line -> object (zstd-compressed DWARF
    # sections). icicle-cpu has no feature to drop that and the workspace manifest may not patch
    # it. The only icicle entry point that parses a program image's debug info is
    # icicle_cpu::debug_info::DebugInfo::add_file, called by icicle's PE loader and icicle-linux;
    # the kraken-rewrite oracle maps PT_LOAD segments itself and reads ELF symbols and relocations
    # with object's ELF reader, never DWARF. crates/kraken-rewrite/tests/no_debug_info.rs fails if
    # that changes. Details: docs/design/0013-rewrite-pipeline.md.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd is unreachable from KRAKEN: only icicle's DebugInfo::add_file (PE loader, icicle-linux) decodes compressed debug sections, and kraken-rewrite never calls it (guarded by tests/no_debug_info.rs); no icicle feature drops the dependency (ADR 0013). Revisit when object moves to ruzstd >= 0.9.1" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0", "OFL-1.1",
    # Boost: clipboard-win / error-code, Windows-only deps of eframe clipboard support.
    "BSL-1.0",
]
confidence-threshold = 0.8

# egui's bundled default fonts include Ubuntu-Light (Ubuntu Font Licence). The KRAKEN GUI app will
# ship its own OFL fonts and disable egui's default_fonts before the first GUI release.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["Ubuntu-font-1.0"] },
]

# icicle-emu (kraken-rewrite oracle) is MIT OR Apache-2.0 (README, LICENCE-MIT and LICENCE-APACHE
# at the repository root) but its crate manifests carry no license field. Clarified per crate; the
# license files live at the repository root, outside each crate directory, so none can be hashed.
[[licenses.clarify]]
crate = "icicle-cpu"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "icicle-jit"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "icicle-linux"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "icicle-mem"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "icicle-vm"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "pcode"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "sleigh-compile"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "sleigh-parse"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "sleigh-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# icicle-emu is not on crates.io. One repository, pinned by commit in crates/kraken-rewrite/Cargo.toml
# (Cargo.lock holds the same commit). Decision record: spikes/rewrite-loop/NOTES.md.
allow-git = ["https://github.com/icicle-emu/icicle-emu"]
