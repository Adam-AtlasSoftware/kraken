name: Release

# On a tag v*: build, package, checksum, attest and create a DRAFT GitHub release.
# workflow_dispatch with a version is a dry run: everything is built and uploaded as workflow
# artifacts, but no release is created.
# No secrets are used. Each platform job is independent (fail-fast: false), so Linux ships
# even when macOS or Windows fail. macOS binaries are ad-hoc signed only (decision 72).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a dry run, without the leading v (for example 0.1.0-dryrun)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  GHIDRA_VERSION: "12.2"
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
  JDK_URL: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
  JDK_SHA256: 68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb
  # The .NET SDK that builds the managed sidecar is pinned (with its sha512) in dotnet/install-sdk.sh.
  DOTNET_SDK_VERSION: "10.0.402"

permissions:
  contents: read

jobs:
  # The version string every other job uses, validated once.
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            is_tag=true
          else
            version="${INPUT_VERSION#v}"
            is_tag=false
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9][0-9A-Za-z._+-]*$'; then
            echo "bad version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"

  # Platform independent pieces: the Java extension jar and the built mdBook.
  assets:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Ghidra and Temurin
        id: toolcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kraken-dev
          key: kraken-dev-ghidra-12.2-${{ env.GHIDRA_SHA256 }}-jdk-${{ env.JDK_SHA256 }}

      - name: Download Ghidra and Temurin
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/kraken-dev/ghidra ~/.cache/kraken-dev/jdk
          cd "$RUNNER_TEMP"
          curl -fsSL -o ghidra.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  ghidra.zip" | sha256sum -c -
          curl -fsSL -o jdk.tar.gz "$JDK_URL"
          echo "$JDK_SHA256  jdk.tar.gz" | sha256sum -c -
          unzip -q ghidra.zip -d ~/.cache/kraken-dev/ghidra
          tar -xzf jdk.tar.gz -C ~/.cache/kraken-dev/jdk

      - name: Select the toolchains
        run: |
          set -euo pipefail
          ghidra=$(echo ~/.cache/kraken-dev/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC)
          jdk=$(echo ~/.cache/kraken-dev/jdk/jdk-25*)
          test -d "$ghidra" && test -d "$jdk"
          {
            echo "GHIDRA_INSTALL_DIR=$ghidra"
            echo "JAVA_HOME=$jdk"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build the Ghidra extension
        run: |
          set -euo pipefail
          cargo xtask ghidra-ext
          test -f java/kraken-ghidra/build/libs/kraken-ghidra.jar
          mkdir -p dist
          cp java/kraken-ghidra/build/libs/kraken-ghidra.jar dist/kraken-ghidra.jar

      - name: Cache the .NET SDK
        id: dotnetcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kraken-dev/dotnet
          key: kraken-dev-dotnet-sdk-${{ env.DOTNET_SDK_VERSION }}-${{ hashFiles('dotnet/install-sdk.sh') }}

      - name: Build the .NET sidecar
        run: |
          set -euo pipefail
          dotnet/install-sdk.sh
          cargo xtask dotnet-ext
          test -f dotnet/kraken-dotnet/bin/kraken-dotnet.dll
          mkdir -p dist
          cp -R dotnet/kraken-dotnet/bin dist/kraken-dotnet

      - name: Check the notices are current
        run: |
          set -euo pipefail
          cargo xtask notices
          git diff --exit-code THIRD-PARTY-NOTICES.md crates/engine-native-sys/licenses

      - name: Build the documentation
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mdbook" build docs
          cp -R docs/book dist/docs

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: dist
          if-no-files-found: error

  package:
    needs: [version, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # macOS is paused (lowest priority); restore this entry to build it again:
          # - os: macos-14
          #   target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: dist-assets

      # Linux links the native engine's decompiler (Ghidra's C++ sources, pinned and SHA-256
      # checked by `cargo xtask native-src`) and ships its worker; their license and notice texts
      # are in THIRD-PARTY-NOTICES.md and licenses/ (package.sh checks both).
      - name: Cache the pinned Ghidra sources
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kraken-dev/ghidra-src
          key: kraken-dev-ghidra-src-${{ hashFiles('xtask/src/native_src.rs') }}

      - name: Fetch the native engine sources and compile its Sleigh files
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo xtask native-src
          cargo xtask native-sla
          echo "KRAKEN_NATIVE_SLA_DIR=$HOME/.cache/kraken-dev/native-sla/Ghidra_${GHIDRA_VERSION}_build" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p kraken-cli -p krakend -p kraken-gui -p engine-native \
              -p kraken-emu --features engine-native-sys/require-native
          else
            cargo build --release --locked -p kraken-cli -p krakend -p kraken-gui
          fi

      - name: Package
        env:
          KRAKEN_REQUIRE_NATIVE: ${{ runner.os == 'Linux' && '1' || '0' }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          KRAKEN_GHIDRA_JAR: dist-assets/kraken-ghidra.jar
          KRAKEN_DOTNET_DIR: dist-assets/kraken-dotnet
          KRAKEN_DOCS_DIR: dist-assets/docs
        run: scripts/package.sh "$TARGET" "$VERSION" out

      # The same Linux archive as an AppImage (appimagetool and its runtime are pinned and
      # SHA-256 checked by the script).
      - name: AppImage
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/appimage.sh "out/kraken-$VERSION-$TARGET.tar.gz" out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/kraken-*
            out/KRAKEN-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            out/kraken-*.tar.gz
            out/kraken-*.zip
            out/KRAKEN-*.AppImage
            out/*.sha256
          if-no-files-found: error

  # Collects whatever packaged successfully, writes SHA256SUMS and, on a tag, creates a draft release.
  release:
    needs: [version, package]
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: parts
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release
          find parts -maxdepth 1 -type f \( -name 'kraken-*.tar.gz' -o -name 'kraken-*.zip' -o -name 'KRAKEN-*.AppImage' \) -exec cp {} release/ \;
          ls release
          # Linux is the supported platform: never publish a release without it.
          ls release/kraken-*-x86_64-unknown-linux-gnu.tar.gz
          cd release
          sha256sum kraken-* KRAKEN-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*
          if-no-files-found: error

      - name: Create the draft release
        if: ${{ needs.version.outputs.is_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" release/* --repo "$REPO" --draft --verify-tag \
            --title "KRAKEN $TAG" --generate-notes "${prerelease[@]}"
