name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GHIDRA_VERSION: "12.2"
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
  JDK_URL: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz
  JDK_SHA256: 68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Downloads every crate source (incl. other platforms') so the notices staleness test runs.
      - run: cargo fetch --locked
      - name: cargo test --workspace
        shell: bash
        run: cargo test --workspace 2>&1 | tee test-output.log; exit ${PIPESTATUS[0]}
      # macOS keeps temp dirs behind a symlink (/var -> /private/var); reproduce that here so
      # path canonicalization bugs in the daemon's live events show up on Linux too.
      - name: live daemon tests under a symlinked TMPDIR
        shell: bash
        run: |
          mkdir -p /tmp/kr && ln -sfn /tmp/kr /tmp/kl
          TMPDIR=/tmp/kl KRAKEN_NO_DAEMON=1 cargo test -p kraken-viewmodel -p kraken-gui live 2>&1 | tee -a test-output.log; exit ${PIPESTATUS[0]}
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E -A1 -- '--- FAILED|panicked at|^error(\[|:)' test-output.log | grep -v '^--$' | head -60 | while IFS= read -r line; do
            echo "::error title=test failure::${line//%/%25}"
          done || true

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - run: mdbook build docs

  real-ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Preflight, sandbox support of this runner
        run: |
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unavailable)"
          python3 - <<'PY'
          import ctypes, os
          libc = ctypes.CDLL(None, use_errno=True)
          # landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION) returns the ABI version
          abi = libc.syscall(444, None, 0, 1)
          print("landlock abi:", abi if abi >= 0 else "unavailable (errno %d)" % ctypes.get_errno())
          PY
          echo "unprivileged userns: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo n/a) / apparmor restrict: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"

      - name: Cache Ghidra and Temurin
        id: toolcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kraken-dev
          key: kraken-dev-ghidra-12.2-${{ env.GHIDRA_SHA256 }}-jdk-${{ env.JDK_SHA256 }}

      - name: Download Ghidra and Temurin
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/kraken-dev/ghidra ~/.cache/kraken-dev/jdk
          cd "$RUNNER_TEMP"
          curl -fsSL -o ghidra.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  ghidra.zip" | sha256sum -c -
          curl -fsSL -o jdk.tar.gz "$JDK_URL"
          echo "$JDK_SHA256  jdk.tar.gz" | sha256sum -c -
          unzip -q ghidra.zip -d ~/.cache/kraken-dev/ghidra
          tar -xzf jdk.tar.gz -C ~/.cache/kraken-dev/jdk

      - name: Select the toolchains
        run: |
          set -euo pipefail
          ghidra=$(echo ~/.cache/kraken-dev/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC)
          jdk=$(echo ~/.cache/kraken-dev/jdk/jdk-25*)
          test -d "$ghidra" && test -d "$jdk"
          {
            echo "KRAKEN_GHIDRA_HOME=$ghidra"
            echo "GHIDRA_INSTALL_DIR=$ghidra"
            echo "KRAKEN_JAVA_HOME=$jdk"
            echo "JAVA_HOME=$jdk"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build the Ghidra extension
        run: cargo xtask ghidra-ext

      # Fails loudly when Landlock is unavailable: allow_unconfined stays false. The GUI's
      # screenshot tests are ignored too, but they render with a GPU this runner does not have;
      # they are run by hand to refresh the documentation images.
      - name: Run the ignored (real Ghidra) tests
        shell: bash
        run: cargo test --workspace -- --ignored --test-threads=1 --skip screenshot --skip _png 2>&1 | tee test-output.log; exit ${PIPESTATUS[0]}
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E -A1 -- '--- FAILED|panicked at|^error(\[|:)' test-output.log | grep -v '^--$' | head -60 | while IFS= read -r line; do
            echo "::error title=test failure::${line//%/%25}"
          done || true

  # The native engine against Ghidra's fixtures, on every merge. The decompiler sources and the
  # compiled Sleigh tree are the pinned ones (`cargo xtask native-src` / `native-sla`), cached by
  # the hash of the xtask files that pin them. Tests of this engine print "skipped: ..." and pass
  # when a prerequisite is missing; here that is a failure, so a green leg means the comparison ran.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        set:
          - corpus
          - corpus/pe
          - corpus/elf32
          - corpus/arm32
          - corpus/aarch64
          - corpus/riscv64
          - corpus/riscv32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned Ghidra sources and the compiled Sleigh tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kraken-dev/ghidra-src
            ~/.cache/kraken-dev/native-sla
          key: kraken-dev-native-${{ hashFiles('xtask/src/native_src.rs', 'xtask/src/native_sla.rs') }}

      - name: Fetch the native engine sources and compile its Sleigh files
        run: |
          set -euo pipefail
          cargo xtask native-src
          cargo xtask native-sla
          echo "KRAKEN_NATIVE_SPECS=$HOME/.cache/kraken-dev/native-sla/Ghidra_${GHIDRA_VERSION}_build" >> "$GITHUB_ENV"

      - name: The native crates and the end-to-end flow (default set only)
        if: matrix.set == 'corpus'
        shell: bash
        env:
          KRAKEN_NO_DAEMON: "1"
        run: |
          cargo test -p engine-native-sys -p engine-native --features engine-native-sys/require-native 2>&1 | tee native-output.log
          test ${PIPESTATUS[0]} -eq 0
          cargo test -p kraken-e2e --test exit_criterion_native --features engine-native-sys/require-native 2>&1 | tee -a native-output.log
          exit ${PIPESTATUS[0]}

      - name: Agreement with Ghidra over the set
        shell: bash
        env:
          KRAKEN_AGREEMENT_SET: ${{ matrix.set }}
        run: |
          cargo test -p engine-native --features engine-native-sys/require-native \
            --test agreement agreement_over_the_corpus -- --ignored --nocapture 2>&1 | tee -a native-output.log
          exit ${PIPESTATUS[0]}

      - name: Fail when a test skipped itself
        if: always()
        shell: bash
        run: |
          if grep -n 'skipped:' native-output.log; then
            echo "::error title=native tests skipped::a prerequisite is missing, the comparison did not run"
            exit 1
          fi

  # Python module (decision 15). The wheel is built twice: as released (no test hook), then with
  # the `testing` feature for the pytest suite, which runs against a FakeEngine-backed in-process
  # project plus a private krakend with its scripted fake engine. No Ghidra is needed.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      KRAKEN_NO_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "maturin>=1.7,<2" "pytest>=8"
      - name: Build the release wheel
        run: maturin build --release -m crates/kraken-py/Cargo.toml --out dist-py/release
      - name: Smoke-test the release wheel (it must not carry the test hook)
        run: |
          python -m pip install --force-reinstall dist-py/release/*.whl
          cd "$RUNNER_TEMP"
          python -c "import kraken; from kraken import _native; assert not _native.has_testing(); print('kraken', kraken.__version__)"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: kraken-wheel-linux-x86_64
          path: dist-py/release/*.whl
      - name: Build the test wheel
        run: maturin build -m crates/kraken-py/Cargo.toml --features testing --out dist-py/test
      - run: python -m pip install --force-reinstall dist-py/test/*.whl
      - name: Build krakend for the daemon tests
        run: cargo build -p krakend
      - name: pytest
        env:
          KRAKEN_TEST_KRAKEND: ${{ github.workspace }}/target/debug/krakend
        run: python -m pytest crates/kraken-py/tests
      - name: No daemon left behind
        run: |
          for _ in 1 2 3 4 5; do pgrep -x krakend || exit 0; sleep 1; done
          exit 1

  # macOS arm64 and Windows x86_64 are tier 1 from 0.2.x. Real-Ghidra tests stay Linux-only
  # until the sidecar sandbox exists on these platforms (decision 71).
  test-other-os:
    # Non-blocking for now: Linux first (decision 95).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KRAKEN_NO_DAEMON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-targets
      - name: cargo test --workspace
        shell: bash
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log; exit ${PIPESTATUS[0]}

      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Job logs need admin rights; annotations are public, so surface the failures there.
          grep -E -A1 -- '--- FAILED|panicked at|^error(\[|:)' test-output.log | grep -v '^--$' | head -60 | while IFS= read -r line; do
            echo "::error title=test failure::${line//%/%25}"
          done || true
