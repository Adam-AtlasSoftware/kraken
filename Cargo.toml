[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Adam-AtlasSoftware/kraken"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"
thiserror = "2"
kraken-proto = { path = "crates/kraken-proto", version = "0.0.0" }
