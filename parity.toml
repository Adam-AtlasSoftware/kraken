# How closely the native engine agrees with Ghidra 12.2, one row per capability and fixture set.
#
# `cargo xtask parity` measures every row (recall against the recorded Ghidra results), writes
# parity.json and the table in docs/design/0014-native-engine.md, and fails when a row falls
# below its `threshold` or when `status` disagrees with the measurement:
#   parity   recall >= 95%
#   partial  recall between 1% and 95%
#   missing  recall below 1%
# `test` names a function in crates/engine-native/tests that guards the row. Raise a threshold
# when a change improves the number; never lower one without saying why in the commit.

# ---- x86-64 and x86 ELF (corpus/fixtures: 20 binaries, stripped ones included) -------------

[[row]]
capability = "functions"
set = "corpus"
format = "ELF x86-64"
threshold = 0.99
status = "parity"
test = "finds_the_functions_ghidra_finds_in_stripped_binaries"

[[row]]
capability = "names"
set = "corpus"
format = "ELF x86-64"
threshold = 0.99
status = "parity"
test = "agrees_with_ghidra_on_the_guarded_binaries"

[[row]]
capability = "decompile_text"
set = "corpus"
format = "ELF x86-64"
threshold = 0.5
status = "partial"
test = "parity_report"

[[row]]
capability = "globals"
set = "corpus"
format = "ELF x86-64"
threshold = 0.8
status = "partial"
test = "parity_report"

[[row]]
capability = "types"
set = "corpus"
format = "ELF x86-64"
threshold = 0.89
status = "partial"
test = "cpp_names_and_dwarf_signatures_agree_with_ghidra"

[[row]]
capability = "memory"
set = "corpus"
format = "ELF x86-64"
threshold = 0.99
status = "parity"
test = "parity_report"

[[row]]
capability = "disassembly"
set = "corpus"
format = "ELF x86-64"
threshold = 0.98
status = "parity"
test = "agrees_with_ghidra_on_the_guarded_binaries"

[[row]]
capability = "jump_tables"
set = "corpus"
format = "ELF x86-64"
threshold = 0.66
status = "partial"
test = "native_jump_tables_agree_with_the_recorded_switches"

