# ---- big-endian MIPS and PowerPC ELF (corpus/mips, corpus/ppc32: four binaries each) ---------
# Ghidra loses the switch of `vm_run` on MIPS, so jump_tables there has nothing to compare. On
# PowerPC disassembly stops at .97 because Ghidra, not knowing `vm_fail` never returns in the
# stripped build, runs on into `op_name`; types misses three anonymous `dt_` function types, and
# globals counts Ghidra's `PTR_<import>` labels of the call stubs, which native calls by name.
# `names` reads Ghidra's `<n>.plt_pic32.<import>` stub symbols as the import (see `stub_name` in
# crates/engine-native/tests/agreement.rs).

[[row]]
capability = "functions"
set = "corpus/mips"
format = "ELF MIPS BE"
threshold = 0.99
status = "parity"
test = "agrees_with_ghidra_on_mips_and_powerpc"

