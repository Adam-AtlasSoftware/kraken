[workspace]

[package]
name = "mcp-echo"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "=1.2.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }
anyhow = "1"

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
serde_json = "1"
